name: Daily Job Search

on:
  schedule:
    - cron: '0 6 * * *'  # entspricht 08:00 MESZ (Sommerzeit). Anpassung ggf. nötig.
  workflow_dispatch: {}

permissions:
  contents: write  # nötig, damit seen_jobs.json und drafts/ committed werden können

jobs:
  search-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run job agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GENERATIVE_API_URL: ${{ secrets.GENERATIVE_API_URL }}  # optional
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
        run: |
          python job_agent.py

      - name: Commit changes (seen_jobs.json + drafts)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_jobs.json || true
          git add drafts || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(job-agent): update seen_jobs and drafts [skip ci]" || true
            git push origin HEAD
          fi
